<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>You're Offline - ASO Online Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --ink: #0D0D0D;
            --red: #E8002D;
            --off: #F4F1EC;
            --mid-gray: #6B6B6B;
            --light-gray: #E5E1DA;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: var(--off);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--ink);
        }
        .offline-card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border: 2px solid var(--ink);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
        }
        .brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .brand span { color: var(--red); }
        .status-dot {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--ink);
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 16px;
        }
        p {
            font-size: 14px;
            color: var(--mid-gray);
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .retry-btn {
            display: block;
            width: 100%;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background .2s;
        }
        .retry-btn:hover { background: var(--red); }
        .footnote {
            margin-top: 24px;
            font-size: 11px;
            color: var(--mid-gray);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="brand">ASO Online Market<span>.</span></div>
        <div class="status-dot">&#128263;</div>
        <h1>You're<br>Offline</h1>
        <p>Your internet connection is unavailable. Check your network and try again to keep shopping.</p>
        <button class="retry-btn" onclick="window.location.reload();">Try Again</button>
        <p class="footnote">ASO Online Market &mdash; Fast, Secure &amp; Premium</p>
    </div>
</body>
</html>
